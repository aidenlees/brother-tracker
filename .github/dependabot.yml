# Dependency updates (CLAUDE.md, Phase 5). Weekly, grouped so a week's updates arrive as
# one pull request per kind, and only once a release is a week old: most supply-chain
# attacks are caught and pulled within days. CI must pass before any of them merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
