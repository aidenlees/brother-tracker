# Every pull request and every push to main. A PR merges only when this passes.
# Runs entirely against a throwaway local Supabase stack; it never touches the cloud project.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
      - name: Lint (ESLint, Prettier, design tokens)
        run: pnpm lint
      - name: Unit tests
        run: pnpm test

      - name: Start local Supabase (migrations + local seed)
        run: pnpm supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,mailpit
      - name: RLS tests (pgTAP)
        run: pnpm supabase test db
      - name: Database advisors
        run: pnpm supabase db advisors --type all --fail-on warn
      - name: Seed trackers and plan templates
        run: pnpm seed
      - name: Local test students around today (e2e fixtures)
        run: pnpm e2e:fixtures

      - name: End-to-end tests
        run: |
          pnpm env:local
          pnpm exec playwright install --with-deps chromium
          pnpm e2e

      - name: Build and scan for secrets
        run: pnpm build && pnpm check:secrets

      - name: Keep the Playwright report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
